name: Apply Yahoo Transit integration

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch integration
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('js/endpoints.js'); s=p.read_text(); old='"routes": "routes" }[what] ?? what'; new='"routes": "routes", "yahoo:transit": "yahoo/transit" }[what] ?? what'; assert old in s; p.write_text(s.replace(old,new,1))
          p=Path('js/routes.js'); s=p.read_text(); marker='import { summarizeTransitLeg, transitFieldMask } from "./transit.js";'; assert marker in s; s=s.replace(marker,marker+'\nimport { searchYahooTransit } from "./yahoo-transit.js";',1)
          old='''  if (mode === "TRANSIT") {
    const key = cacheKey(points, "TRANSIT-stations", opts.departAt);
    const hit = routeCache.get(key);
    if (hit) return hit;
    const result = await computeViaStations(points, opts);
    routeCache.set(key, result);
    return result;
  }'''
          new='''  if (mode === "TRANSIT") {
    const key = cacheKey(points, "TRANSIT-yahoo", opts.departAt);
    const hit = routeCache.get(key);
    if (hit) return hit;
    if (points.length === 2) {
      try {
        const yahoo = await searchYahooTransit(points[0], points[1], opts);
        if (yahoo?.routed && yahoo.minutes > 0) {
          const result = { legs: [{ minutes: yahoo.minutes, meters: Math.round(haversineKm(points[0], points[1]) * 1000), line: yahoo.summary ?? "Yahoo!路線情報", routed: true, yahoo: yahoo.meta ?? null }], routed: true, mode: "TRANSIT", modeNote: "Yahoo!路線情報で検索" };
          routeCache.set(key, result); return result;
        }
      } catch (e) { usage.lastError = `Yahoo Transit: ${String(e?.message ?? e).slice(0, 200)}`; }
    }
    const result = await computeViaStations(points, opts);
    routeCache.set(key, result); return result;
  }'''
          assert old in s; p.write_text(s.replace(old,new,1))
          p=Path('server/worker.js'); s=p.read_text(); marker='const ROUTES_URL = "https://routes.googleapis.com/directions/v2:computeRoutes";'; assert marker in s; s=s.replace(marker,marker+'\nconst YAHOO_TRANSIT_URL = "https://transit.yahoo.co.jp/search/result";',1)
          dispatch='''      if (path.endsWith("/routes")) {
        return cors(await routes(request, env), origin);
      }'''; assert dispatch in s; s=s.replace(dispatch,dispatch+'\n      if (path.endsWith("/yahoo/transit")) {\n        return cors(await yahooTransit(request), origin);\n      }',1)
          fn=r'''async function yahooTransit(request) {
  const body = await readJson(request);
  const from = String(body?.from ?? "").trim(); const to = String(body?.to ?? "").trim();
  if (!from || !to || from.length > 100 || to.length > 100) return text("出発地と到着地が必要です", 400);
  const u = new URL(YAHOO_TRANSIT_URL); u.searchParams.set("from",from); u.searchParams.set("to",to); u.searchParams.set("shin","1"); u.searchParams.set("ex","1"); u.searchParams.set("al","1"); u.searchParams.set("s","0");
  const res = await fetch(u,{headers:{"User-Agent":"Mozilla/5.0 (compatible; TabisakiTransit/1.0)","Accept-Language":"ja-JP,ja;q=0.9"},signal:AbortSignal.timeout(UPSTREAM_TIMEOUT_MS)});
  if (!res.ok) return text(`Yahoo Transit ${res.status}`,502);
  const html=await res.text(); const route=html.match(/id=["']route01["'][\s\S]*?<\/div>\s*<\/div>/i)?.[0] ?? html; const time=route.match(/([0-9]{1,2}:[0-9]{2})[^0-9]{0,120}([0-9]{1,2}:[0-9]{2})/);
  if(!time) return json({routed:false,url:u.toString(),reason:"経路結果を取得できませんでした"}); const [h1,m1]=time[1].split(":").map(Number),[h2,m2]=time[2].split(":").map(Number); let minutes=(h2*60+m2)-(h1*60+m1); if(minutes<0)minutes+=1440; if(minutes<=0||minutes>1440)return json({routed:false,url:u.toString()});
  const summary=route.replace(/<[^>]+>/g," ").replace(/\s+/g," ").trim().slice(0,240); return json({routed:true,minutes,summary,meta:{url:u.toString(),departure:time[1],arrival:time[2]}});
}

'''
          insert='async function routes(request, env) {'; assert insert in s; p.write_text(s.replace(insert,fn+insert,1))
          Path('js/yahoo-transit.js').write_text('''import { endpointFor } from "./endpoints.js";
import { effectiveConfig } from "./settings.js";
export async function searchYahooTransit(from,to,opts={}) {
  const cfg=effectiveConfig(); const fromName=String(from?.name??from??"").trim(); const toName=String(to?.name??to??"").trim(); if(!fromName||!toName)return null;
  const res=await fetch(endpointFor("yahoo:transit",{},cfg),{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({from:fromName,to:toName,departAt:opts.departAt?.toISOString?.()??null}),signal:opts.signal}); if(!res.ok)throw new Error(`Yahoo Transit ${res.status}`); return res.json();
}
''')
          PY
      - name: Verify syntax
        run: node --check js/routes.js && node --check js/yahoo-transit.js && node --check server/worker.js && node --check js/endpoints.js
      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/routes.js js/endpoints.js js/yahoo-transit.js server/worker.js; git rm .github/workflows/apply-yahoo-final.yml
          git commit -m 'feat: use Yahoo Transit for Japan public transport'; git push
