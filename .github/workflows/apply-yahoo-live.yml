name: Apply Yahoo Transit live integration

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 tools/apply_yahoo_live.py
      - name: Verify syntax
        run: |
          node --check js/routes.js
          node --check js/yahoo-transit.js
          node --check server/worker.js
          node --check js/endpoints.js
      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/routes.js server/worker.js tools/apply_yahoo_live.py
          git rm .github/workflows/apply-yahoo-live.yml
          git commit -m 'feat: use Yahoo Transit for Japan public transport'
          git push
