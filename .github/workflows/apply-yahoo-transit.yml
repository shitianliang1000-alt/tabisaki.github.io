name: Apply Yahoo transit integration

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/enable-yahoo-transit.mjs"
      - ".github/workflows/apply-yahoo-transit.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply integration
        run: node scripts/enable-yahoo-transit.mjs
      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/routes.js js/yahoo-transit.js server/worker.js
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "feat: route Japan transit through Yahoo Transit"
          git push
